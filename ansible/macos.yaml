- name: macOS Configuration
  hosts: localhost
  tasks:
    - name: Install Homebrew packages
      community.general.homebrew:
        name:
          - stow
          - neovim
          - neovide
          - tmux
          - fzf
          - fd
          - eza
          - ripgrep
          - bat
          - jq
          - sox
          - tree
          - watch
          - parallel
          - starship
          - tree-sitter
          - gh
          - go
          - git-delta
          - node
          - ical-buddy
          - podman-compose
          - zoxide
          - rtk
        state: present

    - name: Tap hamed-elfayome/claude-usage (Claude Usage Tracker)
      community.general.homebrew_tap:
        name: hamed-elfayome/claude-usage
        state: present

    # Homebrew now refuses formulae/casks from untrusted third-party taps
    # unless the tap is explicitly trusted (see https://docs.brew.sh/Tap-Trust).
    - name: Trust hamed-elfayome/claude-usage tap
      ansible.builtin.command: brew trust hamed-elfayome/claude-usage
      register: brew_trust
      changed_when: "'Already trusted' not in brew_trust.stdout"

    - name: Install Homebrew cask packages
      community.general.homebrew_cask:
        name:
          - font-jetbrains-mono-nerd-font
          - font-fira-code-nerd-font
          - ghostty
          - karabiner-elements
          - linearmouse
          - podman-desktop
          - gcloud-cli
          - meetingbar
          - claude-usage-tracker
          - google-drive
        state: present

    - name: Install vinote
      ansible.builtin.shell:
        cmd: go install github.com/marad/vinote/cmd/vn@latest
        creates: ~/go/bin/vn

    # The notes repo syncs through a LaunchAgent rather than cron. gh is the git
    # credential helper for github.com and keeps its token in the login
    # keychain, which a cron job cannot read: gh then reports the token as
    # invalid and every push dies with "could not read Username". launchd runs
    # the job inside the user session, where the keychain is available.
    - name: Remove the old notes auto-commit cron job
      ansible.builtin.cron:
        name: Auto-commit notes repository
        state: absent

    - name: Install notes auto-commit LaunchAgent
      ansible.builtin.copy:
        dest: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.marad.notes-autocommit.plist"
        mode: "0644"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>Label</key>
              <string>com.marad.notes-autocommit</string>
              <key>ProgramArguments</key>
              <array>
                  <string>{{ ansible_env.HOME }}/bin/notes-autocommit</string>
              </array>
              <key>StartInterval</key>
              <integer>3600</integer>
              <key>RunAtLoad</key>
              <true/>
              <key>EnvironmentVariables</key>
              <dict>
                  <!-- git and gh live in /opt/homebrew/bin; launchd's default PATH won't find them -->
                  <key>PATH</key>
                  <string>/opt/homebrew/bin:/usr/bin:/bin</string>
              </dict>
              <key>StandardOutPath</key>
              <string>{{ ansible_env.HOME }}/notes-auto-commit.log</string>
              <key>StandardErrorPath</key>
              <string>{{ ansible_env.HOME }}/notes-auto-commit.log</string>
          </dict>
          </plist>
      register: notes_autocommit_plist

    - name: Reload notes auto-commit LaunchAgent
      ansible.builtin.shell:
        cmd: >-
          launchctl unload {{ plist | quote }} 2>/dev/null;
          launchctl load {{ plist | quote }}
      vars:
        plist: "{{ ansible_env.HOME }}/Library/LaunchAgents/com.marad.notes-autocommit.plist"
      when: notes_autocommit_plist.changed

    # --- macOS system preferences (defaults) ---
    # Reproducible system settings. Each entry is idempotent; the handlers
    # below restart Dock/Finder/WindowManager so changes apply immediately.
    - name: Dock — auto-hide
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide
        type: bool
        value: true
      notify: restart Dock

    - name: Dock — remove auto-hide delay
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide-delay
        type: float
        value: 0
      notify: restart Dock

    - name: Dock — do not show recent apps
      community.general.osx_defaults:
        domain: com.apple.dock
        key: show-recents
        type: bool
        value: false
      notify: restart Dock

    - name: Stage Manager — enabled
      community.general.osx_defaults:
        domain: com.apple.WindowManager
        key: GloballyEnabled
        type: bool
        value: true
      notify: restart WindowManager

    - name: Stage Manager — do not show desktop when clicking wallpaper
      community.general.osx_defaults:
        domain: com.apple.WindowManager
        key: EnableStandardClickToShowDesktop
        type: bool
        value: false
      notify: restart WindowManager

    - name: Dock — tile size
      community.general.osx_defaults:
        domain: com.apple.dock
        key: tilesize
        type: int
        value: 47
      notify: restart Dock

    - name: Dock — scale minimize effect
      community.general.osx_defaults:
        domain: com.apple.dock
        key: mineffect
        type: string
        value: scale
      notify: restart Dock

    - name: Dock — bottom-right hot corner is Quick Note
      community.general.osx_defaults:
        domain: com.apple.dock
        key: wvous-br-corner
        type: int
        value: 14
      notify: restart Dock

    - name: Dock — bottom-right hot corner no modifier
      community.general.osx_defaults:
        domain: com.apple.dock
        key: wvous-br-modifier
        type: int
        value: 0
      notify: restart Dock

    - name: Finder — show all file extensions
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: AppleShowAllExtensions
        type: bool
        value: true
      notify: restart Finder

    - name: Finder — show path bar
      community.general.osx_defaults:
        domain: com.apple.finder
        key: ShowPathbar
        type: bool
        value: true
      notify: restart Finder

    - name: Finder — default to list view
      community.general.osx_defaults:
        domain: com.apple.finder
        key: FXPreferredViewStyle
        type: string
        value: Nlsv
      notify: restart Finder

    - name: Scrolling — disable natural scroll direction
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: com.apple.swipescrolldirection
        type: bool
        value: false

    # -1 turns off the scroll acceleration curve, so a scroll wheel notch (and
    # Karabiner's mouse_motion_to_scroll, which posts wheel events through the
    # virtual HID device) always scrolls the same amount instead of ramping up
    # with speed. Needs a logout to take effect; running apps keep the old curve.
    - name: Scrolling - disable scroll wheel acceleration
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: com.apple.scrollwheel.scaling
        type: float
        value: -1

    - name: Text — disable automatic spelling correction
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: NSAutomaticSpellingCorrectionEnabled
        type: bool
        value: false

    - name: Text — disable automatic capitalization
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: NSAutomaticCapitalizationEnabled
        type: bool
        value: false

    - name: Keyboard — fast key repeat
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: KeyRepeat
        type: int
        value: 2

    - name: Keyboard — short delay until repeat
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: InitialKeyRepeat
        type: int
        value: 15

    - name: Screenshots — capture to clipboard instead of files
      community.general.osx_defaults:
        domain: com.apple.screencapture
        key: target
        type: string
        value: clipboard
      notify: restart SystemUIServer

  handlers:
    - name: restart Dock
      ansible.builtin.command: killall Dock
      failed_when: false

    - name: restart Finder
      ansible.builtin.command: killall Finder
      failed_when: false

    - name: restart WindowManager
      ansible.builtin.command: killall WindowManager
      failed_when: false

    - name: restart SystemUIServer
      ansible.builtin.command: killall SystemUIServer
      failed_when: false
