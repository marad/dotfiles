- name: Ubuntu Configuration
  hosts: localhost
  tasks:
    - name: Install required apt packages
      apt:
        name:
          - stow
          - zsh
          - curl
          - tmux
          - xsel
          - fzf
          - unzip
          - zip
          - fontconfig
          - libfontconfig-dev
          - build-essential
          - cmake
          - golang-go
          - tree
          - gh
          - ripgrep
          - fd-find
          - jq
          - eza
          - bat
          - zoxide
          - git-delta
          - feh
          - picom
          - i3blocks
          - waybar
          - grim
          - slurp
          - swaylock
          - swayidle
          - swaybg
          - wl-clipboard
          - alacritty
          - rofi
          - playerctl
          - cliphist
          - xdg-desktop-portal-gtk
          - alsa-utils
          - libnotify-bin
          - xdotool
          - xclip
          - wtype
          - python3-pip
          - pipx
          # ansible.builtin.cron needs the crontab binary
          - cron
        state: latest
        update_cache: yes
      become: true

    # Arch has the ttf-*-nerd packages and macOS the casks; Ubuntu does not
    # package nerd fonts, so take the release zips.
    - name: Install nerd fonts
      ansible.builtin.shell:
        cmd: >-
          curl -fsSL -o /tmp/{{ item }}.zip
          https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ item }}.zip &&
          unzip -o /tmp/{{ item }}.zip -d ~/.local/share/fonts/{{ item }} &&
          rm /tmp/{{ item }}.zip &&
          fc-cache -f
        creates: ~/.local/share/fonts/{{ item }}
      loop:
        - JetBrainsMono
        - FiraCode

    # Ghostty is not in the Ubuntu repos; this is the .deb build the upstream
    # docs point to. On Arch it is a stock package.
    - name: Install ghostty
      become: true
      ansible.builtin.shell:
        cmd: curl -fsSL https://raw.githubusercontent.com/mkasberg/ghostty-ubuntu/HEAD/install.sh | bash
        chdir: /tmp
        creates: /usr/bin/ghostty

    - name: Install starship prompt
      ansible.builtin.shell:
        cmd: curl -sS https://starship.rs/install.sh | sh -s -- -y
        creates: /usr/local/bin/starship

    - name: Install vinote
      ansible.builtin.shell:
        cmd: go install github.com/marad/vinote/cmd/vn@latest
        creates: ~/go/bin/vn

    - name: Make sure that apt neovim package is absent
      become: true
      apt:
        name:
          - neovim
          - neovim-qt
          - neovim-runtime
        state: absent

    - name: Check whether snap is available
      ansible.builtin.command: command -v snap
      register: snap_check
      changed_when: false
      failed_when: false

    - name: Make sure that snap neovim package is absent
      become: true
      when: snap_check.rc == 0
      snap:
        name:
          - nvim
          - nvim-gtk
        state: absent

    - name: Install neovim
      become: true
      ansible.builtin.script:
        cmd: ../scripts/install_nvim.sh
        creates: /opt/nvim-linux-x86_64

    - name: Install node version manager
      ansible.builtin.shell:
        cmd: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
        creates: ~/.nvm

    - name: Install latest nodejs with NVM
      ansible.builtin.shell:
        cmd: bash -c 'source ~/.nvm/nvm.sh && nvm install node'
        creates: ~/.nvm/versions/node

    - name: Install tldr command
      ansible.builtin.shell:
        cmd: bash -c 'source ~/.nvm/nvm.sh && nvm use node && npm install -g tldr'

    - name: Install sdkman
      ansible.builtin.shell:
        cmd: curl -s "https://get.sdkman.io" | bash
        creates: ~/.sdkman

    - name: Install poetry
      ansible.builtin.shell:
        cmd: pipx install poetry
        creates: ~/.local/bin/poetry

    - name: Install Hyprland
      become: true
      ansible.builtin.script:
        cmd: ../scripts/install_hyprland.sh
        creates: /usr/bin/Hyprland

    - name: Install rtk (token-optimizing CLI proxy)
      ansible.builtin.shell:
        cmd: >-
          mkdir -p "$HOME/.local/bin" &&
          curl -fsSL https://github.com/rtk-ai/rtk/releases/latest/download/rtk-x86_64-unknown-linux-musl.tar.gz
          | tar xz -C "$HOME/.local/bin" rtk &&
          chmod +x "$HOME/.local/bin/rtk"
        creates: ~/.local/bin/rtk

    - name: Set default shell to zsh
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh

    - name: Auto-commit notes repository hourly
      ansible.builtin.cron:
        name: Auto-commit notes repository
        minute: "0"
        # Logic lives in bin/bin/notes-autocommit, shared with the macOS
        # LaunchAgent that replaced cron there.
        job: $HOME/bin/notes-autocommit >> $HOME/notes-auto-commit.log 2>&1
