- name: Arch Configuration
  hosts: localhost
  tasks:
    - name: Upgrade system packages
      pacman:
        upgrade: true
      become: true

    - name: Install required packages
      pacman:
        name:
          # --- core CLI tooling ---
          - stow
          - zsh
          - curl
          - xsel
          - neovim
          - tmux
          - fzf
          - eza
          - ripgrep
          - bat
          - fd
          - jq
          - starship
          - unzip
          - zip
          - tree
          - git-delta
          - github-cli
          - zoxide
          # --- cron (ansible.builtin.cron needs the crontab binary) ---
          - cronie
          # --- build toolchain (native deps) ---
          - base-devel
          - cmake
          # --- go (needed to build vinote below) ---
          - go
          # --- fonts ---
          - fontconfig
          - ttf-jetbrains-mono-nerd
          - ttf-firacode-nerd
          # --- python ---
          - python-pip
          - python-pipx
          # --- terminal / launcher ---
          - alacritty
          - ghostty
          - rofi
          # --- i3 (X11) ---
          - i3blocks
          - picom
          - feh
          - xdotool
          - xclip
          # --- Hyprland (Wayland) ---
          # On Arch these are stock packages, so there is no need to build
          # Hyprland from source the way ubuntu.yaml does.
          - hyprland
          - waybar
          - grim
          - slurp
          - swaylock
          - swayidle
          - swaybg
          - wl-clipboard
          - cliphist
          - wtype
          - playerctl
          - xdg-desktop-portal-gtk
          # --- audio / notifications ---
          - alsa-utils
          - libnotify
        state: latest
        update_cache: yes
      become: true

    - name: Install vinote
      ansible.builtin.shell:
        cmd: go install github.com/marad/vinote/cmd/vn@latest
        creates: ~/go/bin/vn

    - name: Install node version manager
      ansible.builtin.shell:
        cmd: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
        creates: ~/.nvm

    - name: Install latest nodejs with NVM
      ansible.builtin.shell:
        cmd: bash -c 'source ~/.nvm/nvm.sh && nvm install node'
        creates: ~/.nvm/versions/node

    - name: Install tldr command
      ansible.builtin.shell:
        cmd: bash -c 'source ~/.nvm/nvm.sh && nvm use node && npm install -g tldr'

    - name: Install sdkman
      ansible.builtin.shell:
        cmd: curl -s "https://get.sdkman.io" | bash
        creates: ~/.sdkman

    - name: Install poetry
      ansible.builtin.shell:
        cmd: pipx install poetry
        creates: ~/.local/bin/poetry

    - name: Install rtk (token-optimizing CLI proxy)
      ansible.builtin.shell:
        cmd: >-
          mkdir -p "$HOME/.local/bin" &&
          curl -fsSL https://github.com/rtk-ai/rtk/releases/latest/download/rtk-x86_64-unknown-linux-musl.tar.gz
          | tar xz -C "$HOME/.local/bin" rtk &&
          chmod +x "$HOME/.local/bin/rtk"
        creates: ~/.local/bin/rtk

    - name: Set default shell to zsh
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        shell: /usr/bin/zsh

    - name: Enable cronie service
      become: true
      ansible.builtin.systemd_service:
        name: cronie
        enabled: true
        state: started

    - name: Auto-commit notes repository hourly
      ansible.builtin.cron:
        name: Auto-commit notes repository
        minute: "0"
        # Logic lives in bin/bin/notes-autocommit, shared with the macOS
        # LaunchAgent that replaced cron there.
        job: $HOME/bin/notes-autocommit >> $HOME/notes-auto-commit.log 2>&1
