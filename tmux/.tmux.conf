new-session

# Enable extended keys for supporting modified Enter keys
set -g extended-keys on

# set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Set prefix shortcut
set-option -g prefix C-q
unbind C-b
bind-key C-q send-prefix

# Move between panels (vim-style)
bind -r -n M-h select-pane -L
bind -r -n M-l select-pane -R
bind -r -n M-k select-pane -U
bind -r -n M-j select-pane -D

bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

# Shift-arrow to switch windows
bind -n S-Right next-window
bind -n S-Left previous-window

# Mouse mode
set -g mouse on
set -g @scroll-speed-num-lines-per-scroll 5

# Escape fix
set -s escape-time 50

# Pass terminal focus events to applications (used by Claude Code, vim autoread)
set -g focus-events on

# Splits
bind-key C-v split-window -h -c '#{pane_current_path}'
bind-key C-h split-window -v -c '#{pane_current_path}'

bind-key r source-file ~/.tmux.conf \; display-message ".tmux.conf reloaded"

# Color
set -g default-terminal "xterm"

# Vi mode
set-window-option -g mode-keys vi
set -g status-keys vi

# Vi-style copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
